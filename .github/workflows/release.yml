name: Release

# Every version in CHANGELOG.md becomes a GitHub release with the same notes.
# - A push to main that changes the version tags that commit vX.Y.Z and publishes its release.
# - Pushing a tag vX.Y.Z (e.g. for an older version) publishes or refreshes that one.
# The newest version is marked "Latest"; older ones never take it over.

on:
  push:
    branches: [main]
    paths: [src/badamoa/__init__.py, CHANGELOG.md]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to know which version is the newest

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/badamoa/__init__.py)"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          fi
          version="${tag#v}"
          python3 scripts/release_notes.py "$version" > notes.md
          title="$(python3 scripts/release_notes.py "$version" --title)"

          newest="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          latest="--latest=false"
          [[ "$tag" == "$newest" ]] && latest="--latest"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md "$latest"
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file notes.md "$latest"
          fi
          echo "published $tag: $title" >> "$GITHUB_STEP_SUMMARY"
