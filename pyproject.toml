[project]
name = "badamoa"
version = "0.1.0"
description = "BADAMOA — installable vision MLOps platform (Build · Annotate · Develop · Automate / MLOps Orchestration & Agents)"
readme = "README.md"
requires-python = ">=3.11"
# Base install = Node Agent + CLI. Keep this list small: it goes on every remote machine.
dependencies = [
    "pydantic>=2.7",
    "fsspec>=2024.6",
    "psutil>=6.0",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
# The Hub (control plane, web UI host, MCP server). No ML dependencies on purpose.
hub = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "mcp>=2.0,<3",
]

[project.scripts]
badamoa = "badamoa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badamoa"]
# The built web UI lands here (gitignored), so include it explicitly.
artifacts = ["src/badamoa/hub/static/**"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
