[project]
name = "badamoa"
dynamic = ["version"]
description = "BADAMOA — installable vision MLOps platform (Build · Annotate · Develop · Automate / MLOps Orchestration & Agents)"
readme = "README.md"
requires-python = ">=3.11"
# Base install = Node Agent + CLI. Keep this list small: it goes on every remote machine.
dependencies = [
    "pydantic>=2.7",
    "fsspec>=2024.6",
    "psutil>=6.0",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "typer>=0.12",
    "pillow>=10.0",  # image size and thumbnails when a node registers data
    "packaging>=23",  # version ranges: which earlier template versions' weights a version reads
]

[project.optional-dependencies]
# The Hub (control plane, web UI host, MCP server). No ML dependencies on purpose.
hub = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "mcp>=2.0,<3",
    "optuna>=4.0,<5",  # Bayesian search (TPE) for sweeps
]

[project.scripts]
badamoa = "badamoa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/badamoa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/badamoa"]
# The built web UI lands here (gitignored), so include it explicitly.
artifacts = ["src/badamoa/hub/static/**"]

# Release notes ship inside the package so the Hub can show them in the UI.
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "badamoa/CHANGELOG.md"
# The guides the Hub shows (hub/guides.py): the user manual and the template guide.
"docs/MANUAL.md" = "badamoa/docs/MANUAL.md"
"docs/TEMPLATE_GUIDE.md" = "badamoa/docs/TEMPLATE_GUIDE.md"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
