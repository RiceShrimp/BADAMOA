# BADAMOA 모델 템플릿 선언. 고친 뒤 `badamoa template check .` 로 확인하고 `badamoa template push .` 로 올립니다.

name    = "__NAME__"          # 영문 소문자·숫자·-·_ (Hub에서 이 템플릿을 가리키는 이름)
title   = "__TITLE__"         # 화면에 보이는 이름
version = "0.1.0"             # 코드를 바꿔 다시 올릴 때마다 올립니다
description = ""
task    = "__TASK__"          # detect | segment | classify
data_format = "yolo"          # BADAMOA가 릴리스를 이 형식으로 풀어 줍니다
variant = "model"             # 모델 종류를 정하는 설정 이름 (모델 이름을 지을 때 씁니다). 없으면 지우세요

[environment]
# 비워 두면 아래 requirements로 서버가 가상환경을 자동으로 만듭니다.
# Hub의 설정 → 환경에 등록한 이름을 적으면 그 환경(서버에 이미 있는 Python 등)을 기본으로 씁니다.
default = ""
requirements = []             # 예: ["torch", "torchvision", "pycocotools"]
python = "3.12"
torch = false                 # true면 서버의 GPU 드라이버에 맞는 PyTorch 빌드를 고릅니다

[entrypoints]
# {config} 자리에 설정 JSON 파일 경로가 들어갑니다. python은 선택된 환경의 Python으로 실행됩니다.
train = "python train.py --config {config}"
# eval    = "python eval.py --config {config}"
# predict = "python predict.py --config {config}"

# 설정(하이퍼파라미터)은 train.py 안에서 badamoa_sdk로 선언합니다: bm.params(lr=bm.number(0.001, …))
# 코드를 건드리지 않고 여기서 선언하거나 덮어쓸 수도 있습니다:
#
# [params.lr]
# type = "number"
# label = "학습률"
# default = 0.001
# group = "최적화"
# advanced = true

# Hub에 올리면 학습 서버 한 대가 작은 합성 데이터로 짧게 돌려 본 뒤(학습 → 테스트 · 평가 · 내보내기) 모두에게 보입니다.
# 그 시험 실행에서만 쓸 설정이나 시간을 바꾸려면:
#
# [check]
# params = { epochs = 1, imgsz = 64 }   # 설정에 epochs가 있으면 따로 적지 않아도 1로 돕니다
# timeout_min = 15                      # 환경 준비를 뺀 시간
# gpu = false                           # CPU로 돌 수 없는 코드만 true (GPU 1장을 짧게 씁니다)
# skip = []                             # 시험하지 않을 진입점. 예: ["export"]
